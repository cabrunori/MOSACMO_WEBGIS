<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; }
        .popup-header { background: #2c3e50; color: white; margin: -14px -14px 10px -14px; padding: 10px; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: bold; text-align: center; }
        .leaflet-popup-content table { width: 100%; border-collapse: collapse; }
        .leaflet-popup-content th { text-align: left; padding: 4px 5px; background-color: #f8f9fa; border: 1px solid #dee2e6; color: #666; font-size: 10px; text-transform: uppercase; }
        .leaflet-popup-content td { padding: 4px 5px; border: 1px solid #dee2e6; font-size: 12px; color: #333; }
        </style>
        <title>MOSAICMO Project Georefereced Data</title>
    </head>
    <body>
        <div id="map"></div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet-svg-shape-markers.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.wms.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet.markercluster.js"></script>

        <script src="data/GasTraces_1.js"></script>
        <script src="data/SourceChemistry_2.js"></script>
        <script src="data/SONDAGGI_PIANA_BOJANO_3.js"></script>
        <script src="data/Sondaggio_4.js"></script>
        <script src="data/sismica_Bojano_NS_geofoni_5.js"></script>
        <script src="data/sismica_Bojano_EW_geofoni_6.js"></script>
        <script src="data/SismicaNSline_7.js"></script>
        <script src="data/SismicaEWline_8.js"></script>
        <script src="data/Boiano_Linea1_9.js"></script>
        <script src="data/Campochiaro_linea3_10.js"></script>
        <script src="data/SanMassimoLinea2_11.js"></script>
        <script src="data/polo_remoto_ERT_Campochiaro_q_12.js"></script>
        <script src="data/ERT_SanMassimo_scarp_13.js"></script>
        <script src="data/ERT_Campochiaro_q_14.js"></script>
        <script src="data/ERT_Centomani_EWq_15.js"></script>
        <script src="data/ERT_SanMassimo1_16.js"></script>
        <script src="data/ERT_SanMassimo2_17.js"></script>
        <script src="data/ERT_Centomani_EWq_lin_18.js"></script>
        <script src="data/ERT_Campochiaro_q_lin_19.js"></script>
        <script src="data/ERT_SanMassimoScarp_lin_20.js"></script>
        <script src="data/ERT_SanMassimo1_lin_21.js"></script>
        <script src="data/ERT_SanMassimo2_lin_22.js"></script>
        <script src="data/Fullwaver_23.js"></script>
        <script src="data/MagnetoTelluricSurveyArea_24.js"></script>
        <script src="data/MagnetoTelluricSurvey_25.js"></script>
        <script src="data/Profili_areaMOSAICMO_SHELL_26.js"></script>
        <script src="data/Profili_2D_Eni_MOSAICMO_27.js"></script>
        <script src="data/Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28.js"></script>
        <script src="data/PozziViDEPIAreaMOSAICMO_29.js"></script>
        <script src="data/ReteSismicaMOSAICMO_30.js"></script>
        <script src="data/WP1_SeismicStations_31.js"></script>
        <script src="data/NODI_32.js"></script>

        <script>
        var map = L.map('map', {zoomControl:false, maxZoom:28, minZoom:1}).fitBounds([[41.37219680758033,14.261983648287774],[41.635252546742855,14.771692711573934]]);
        var hash = new L.Hash(map);

        // --- BASI MAPPA ---
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution: '&copy; OpenStreetMap'});
        var hillshade = L.WMS.layer("https://tinitaly.pi.ingv.it/TINItaly_1_1/wms", "tinitaly_hshd", {format: 'image/png', transparent: true, tiled: true, opacity: 0.7}).addTo(map);

        // --- FUNZIONE POPUP ---
        function setPopup(feature, layer, title, fields) {
            var content = '<div class="popup-header">Layer: ' + title + '</div><table>';
            for (var label in fields) {
                var val = feature.properties[fields[label]];
                if (val) content += '<tr><th>' + label + '</th><td>' + val + '</td></tr>';
            }
            content += '</table>';
            layer.bindPopup(content, {maxHeight: 400});
        }

        // --- INIZIALIZZAZIONE LAYER (Tutti i 32) ---
        // WP1
        var layer_NODI_32 = new L.geoJson(json_NODI_32, { onEachFeature: function(f, l){ setPopup(f, l, 'NODI', {'Nodo':'Node','Quota':'Elev','Data':'DATE'}); } });
        var cluster_NODI_32 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(layer_NODI_32).addTo(map);
        
        var layer_WP1_SeismicStations_31 = new L.geoJson(json_WP1_SeismicStations_31, { onEachFeature: function(f, l){ setPopup(f, l, 'STAZIONI SISMICHE', {'Stazione':'station','Elev':'elevation'}); } });
        var cluster_WP1_SeismicStations_31 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(layer_WP1_SeismicStations_31);

        var layer_ReteSismicaMOSAICMO_30 = new L.geoJson(json_ReteSismicaMOSAICMO_30, { onEachFeature: function(f, l){ setPopup(f, l, 'RETE SISMICA', {'Nome':'nome'}); } });
        var cluster_ReteSismicaMOSAICMO_30 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(layer_ReteSismicaMOSAICMO_30);

        // WP2
        var cluster_PozziViDEPIAreaMOSAICMO_29 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(new L.geoJson(json_PozziViDEPIAreaMOSAICMO_29, { onEachFeature: function(f,l){ setPopup(f,l,'POZZI VIDEPI',{'Nome':'nome','Anno':'anno','Operatore':'operatore'}); } }));
        var layer_Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28 = new L.geoJson(json_Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28, { style: {color: '#000', weight: 3} });
        var layer_Profili_2D_Eni_MOSAICMO_27 = new L.geoJson(json_Profili_2D_Eni_MOSAICMO_27, { style: {color: '#0433ff', weight: 4} });
        var layer_Profili_areaMOSAICMO_SHELL_26 = new L.geoJson(json_Profili_areaMOSAICMO_SHELL_26, { style: {color: '#e15989', weight: 6} });

        // MagnetoTelluric & ERT
        var layer_MagnetoTelluricSurvey_25 = new L.geoJson(json_MagnetoTelluricSurvey_25);
        var layer_MagnetoTelluricSurveyArea_24 = new L.geoJson(json_MagnetoTelluricSurveyArea_24, { style: {fillColor: '#85b66f', fillOpacity: 0.5} });
        var layer_Fullwaver_23 = new L.geoJson(json_Fullwaver_23);
        
        // Linee ERT
        var layer_ERT_SanMassimo2_lin_22 = new L.geoJson(json_ERT_SanMassimo2_lin_22, {style:{color:'#000', weight:3}});
        var layer_ERT_SanMassimo1_lin_21 = new L.geoJson(json_ERT_SanMassimo1_lin_21, {style:{color:'#000', weight:3}});
        var layer_ERT_SanMassimoScarp_lin_20 = new L.geoJson(json_ERT_SanMassimoScarp_lin_20, {style:{color:'#000', weight:3}});
        var layer_ERT_Campochiaro_q_lin_19 = new L.geoJson(json_ERT_Campochiaro_q_lin_19, {style:{color:'#000', weight:3}});
        var layer_ERT_Centomani_EWq_lin_18 = new L.geoJson(json_ERT_Centomani_EWq_lin_18, {style:{color:'#000', weight:3}});

        // Punti ERT
        var layer_ERT_SanMassimo2_17 = new L.geoJson(json_ERT_SanMassimo2_17);
        var layer_ERT_SanMassimo1_16 = new L.geoJson(json_ERT_SanMassimo1_16);
        var layer_ERT_Centomani_EWq_15 = new L.geoJson(json_ERT_Centomani_EWq_15);
        var layer_ERT_Campochiaro_q_14 = new L.geoJson(json_ERT_Campochiaro_q_14);
        var layer_ERT_SanMassimo_scarp_13 = new L.geoJson(json_ERT_SanMassimo_scarp_13);
        var layer_polo_remoto_ERT_Campochiaro_q_12 = new L.geoJson(json_polo_remoto_ERT_Campochiaro_q_12);

        // Sismica Attiva
        var layer_SanMassimoLinea2_11 = new L.geoJson(json_SanMassimoLinea2_11, {style:{color:'#000', weight:3}});
        var layer_Campochiaro_linea3_10 = new L.geoJson(json_Campochiaro_linea3_10, {style:{color:'#000', weight:3}});
        var layer_Boiano_Linea1_9 = new L.geoJson(json_Boiano_Linea1_9, {style:{color:'#000', weight:6}});
        var layer_SismicaEWline_8 = new L.geoJson(json_SismicaEWline_8);
        var layer_SismicaNSline_7 = new L.geoJson(json_SismicaNSline_7);
        var layer_sismica_Bojano_EW_geofoni_6 = new L.geoJson(json_sismica_Bojano_EW_geofoni_6);
        var layer_sismica_Bojano_NS_geofoni_5 = new L.geoJson(json_sismica_Bojano_NS_geofoni_5);

        // WP4
        var cluster_Sondaggio_4 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(new L.geoJson(json_Sondaggio_4, { onEachFeature: function(f,l){ setPopup(f,l,'SONDAGGIO',{'Nome':'sondaggio','Prof':'profondità (m)'}); } }));
        var cluster_SONDAGGI_PIANA_BOJANO_3 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(new L.geoJson(json_SONDAGGI_PIANA_BOJANO_3, { onEachFeature: function(f,l){ setPopup(f,l,'SONDAGGI PIANA',{'Nome':'name','Stratigrafia':'Stratigraphy'}); } }));
        var cluster_SourceChemistry_2 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(new L.geoJson(json_SourceChemistry_2, { onEachFeature: function(f,l){ setPopup(f,l,'CHIMICA SORGENTI',{'ID':'Label','pH':'pH','T':'T'}); } }));
        var cluster_GasTraces_1 = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(new L.geoJson(json_GasTraces_1, { onEachFeature: function(f,l){ setPopup(f,l,'GAS TRACES',{'ID':'Id','CO2':'CO2 %'}); } }));

        // --- MENU ALBERO LIVELLI ---
        var overlaysTree = [
            {label: '<b>Sfondi</b>', children: [{label: "Rilievo (INGV)", layer: hillshade}, {label: "OpenStreetMap", layer: osm}]},
            {label: '<b>WP1 - Reti Sismiche</b>', children: [{label: "NODI", layer: cluster_NODI_32}, {label: "Stazioni Seismic WP1", layer: cluster_WP1_SeismicStations_31}, {label: "Rete MOSAICMO", layer: cluster_ReteSismicaMOSAICMO_30}]},
            {label: '<b>WP2 - Pozzi e Sismica 2D</b>', children: [{label: "Pozzi ViDEPI", layer: cluster_PozziViDEPIAreaMOSAICMO_29}, {label: "Linee VIDEPI", layer: layer_Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28}, {label: "Profili Eni", layer: layer_Profili_2D_Eni_MOSAICMO_27}, {label: "Profili Shell", layer: layer_Profili_areaMOSAICMO_SHELL_26}]},
            {label: '<b>WP3 - Geofisica</b>', children: [
                {label: "Magneto Telluric Survey", layer: layer_MagnetoTelluricSurvey_25},
                {label: "ERT San Massimo 2", layer: layer_ERT_SanMassimo2_17},
                {label: "ERT San Massimo 1", layer: layer_ERT_SanMassimo1_16},
                {label: "Fullwaver", layer: layer_Fullwaver_23},
                {label: "Linee ERT", children: [{label: "San Massimo 2", layer: layer_ERT_SanMassimo2_lin_22}, {label: "San Massimo 1", layer: layer_ERT_SanMassimo1_lin_21}]}
            ]},
            {label: '<b>WP4 - Geochimica e Sondaggi</b>', children: [{label: "Gas Traces", layer: cluster_GasTraces_1}, {label: "Source Chemistry", layer: cluster_SourceChemistry_2}, {label: "Sondaggi Piana", layer: cluster_SONDAGGI_PIANA_BOJANO_3}, {label: "Sondaggio 4", layer: cluster_Sondaggio_4}]}
        ];

        L.control.layers.tree(null, overlaysTree, {collapsed: false}).addTo(map);
        L.control.zoom({position: 'topleft'}).addTo(map);
        </script>
    </body>
</html>
