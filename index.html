<!doctype html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/MarkerCluster.css">
        <link rel="stylesheet" href="css/MarkerCluster.Default.css">
        <style>
        html, body, #map { width: 100%; height: 100%; padding: 0; margin: 0; background: #fff; }
        .popup-header { background: #2c3e50; color: white; margin: -14px -14px 10px -14px; padding: 10px; border-radius: 4px 4px 0 0; font-weight: bold; text-align: center; font-size: 13px; }
        .leaflet-popup-content table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .leaflet-popup-content th { text-align: left; font-size: 10px; color: #777; text-transform: uppercase; padding: 4px; border-bottom: 1px solid #eee; background: #f9f9f9; }
        .leaflet-popup-content td { font-size: 12px; padding: 4px; border-bottom: 1px solid #eee; color: #333; }
        .leaflet-popup-content-wrapper { border-radius: 4px; padding: 0; }
        </style>
        <title>MOSAICMO - WebGIS Project</title>
    </head>
    <body>
        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/leaflet.markercluster.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/leaflet.wms.js"></script>

        <script src="data/GasTraces_1.js"></script>
        <script src="data/SourceChemistry_2.js"></script>
        <script src="data/SONDAGGI_PIANA_BOJANO_3.js"></script>
        <script src="data/Sondaggio_4.js"></script>
        <script src="data/Profili_2D_Eni_MOSAICMO_27.js"></script>
        <script src="data/Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28.js"></script>
        <script src="data/PozziViDEPIAreaMOSAICMO_29.js"></script>
        <script src="data/ReteSismicaMOSAICMO_30.js"></script>
        <script src="data/WP1_SeismicStations_31.js"></script>
        <script src="data/NODI_32.js"></script>

        <script>
        var map = L.map('map', { zoomControl:false, maxZoom:28, minZoom:1 }).fitBounds([[41.37, 14.26],[41.63, 14.77]]);
        
        // Pane per gestire la sovrapposizione: vettori sopra lo sfondo
        map.createPane('pane_vettori');
        map.getPane('pane_vettori').style.zIndex = 600;

        // --- BASI MAPPA ---
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' }).addTo(map);
        
        // Hillshade con identify:false per permettere il click sui vettori sottostanti
        var hillshade = L.WMS.layer("https://tinitaly.pi.ingv.it/TINItaly_1_1/wms", "tinitaly_hshd", {
            format: 'image/png', 
            transparent: true, 
            tiled: true, 
            opacity: 0.7,
            identify: false // <--- Fondamentale per interrogare le linee
        }).addTo(map);

        // --- FUNZIONE POPUP ---
        function pop_Universal(feature, layer, title) {
            var content = '<div class="popup-header">' + title + '</div><table>';
            for (var prop in feature.properties) {
                if (prop !== 'fid' && feature.properties[prop] !== null) {
                    content += '<tr><th>' + prop + '</th><td>' + feature.properties[prop] + '</td></tr>';
                }
            }
            content += '</table>';
            layer.bindPopup(content, {maxHeight: 300, minWidth: 220});
        }

        // --- RIPRISTINO SIMBOLI ORIGINALI (Punti circolari) ---
        function style_Punto(color) {
            return { radius: 6.0, opacity: 1, color: 'rgba(35,35,35,1.0)', weight: 1, fill: true, fillOpacity: 1, fillColor: color, pane: 'pane_vettori' };
        }

        // Inizializzazione Layer
        var layer_NODI = new L.geoJson(json_NODI_32, { 
            pane: 'pane_vettori',
            onEachFeature: function(f,l){ pop_Universal(f,l,'NODI'); },
            pointToLayer: function (f, latlng) { return L.circleMarker(latlng, style_Punto('rgba(164,113,88,1.0)')); }
        });
        var cluster_NODI = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(layer_NODI).addTo(map);

        var layer_Eni = new L.geoJson(json_Profili_2D_Eni_MOSAICMO_27, {
            pane: 'pane_vettori',
            style: { color: '#0433ff', weight: 4, opacity: 1.0 },
            onEachFeature: function(f,l){ pop_Universal(f,l,'PROFILI ENI'); }
        }).addTo(map);

        var layer_LineeVIDEPI = new L.geoJson(json_Lineesismicheacquisiteneititolimineraricessati_VIDEPI_28, {
            pane: 'pane_vettori',
            style: { color: '#333', weight: 3, opacity: 1.0 },
            onEachFeature: function(f,l){ pop_Universal(f,l,'LINEE VIDEPI'); }
        });

        var layer_Pozzi = new L.geoJson(json_PozziViDEPIAreaMOSAICMO_29, {
            pane: 'pane_vettori',
            onEachFeature: function(f,l){ pop_Universal(f,l,'POZZI VIDEPI'); },
            pointToLayer: function (f, latlng) { return L.circleMarker(latlng, style_Punto('rgba(255,0,0,1.0)')); }
        });
        var cluster_Pozzi = new L.MarkerClusterGroup({showCoverageOnHover: false}).addLayer(layer_Pozzi);

        // --- MENU ---
        var overlaysTree = [
            { label: '<b>Sfondi</b>', children: [{label: "Rilievo (INGV)", layer: hillshade}, {label: "OpenStreetMap", layer: osm}]},
            { label: '<b>WP1 - Reti</b>', children: [{label: "Nodi", layer: cluster_NODI}]},
            { label: '<b>WP2 - Pozzi e Linee</b>', children: [{label: "Pozzi ViDEPI", layer: cluster_Pozzi}, {label: "Profili Eni", layer: layer_Eni}, {label: "Linee VIDEPI", layer: layer_LineeVIDEPI}]}
        ];

        L.control.layers.tree(null, overlaysTree, {collapsed: false}).addTo(map);
        L.control.zoom({position: 'topleft'}).addTo(map);
        </script>
    </body>
</html>
